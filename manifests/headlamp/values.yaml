# Values for the kubernetes-sigs/headlamp Helm chart (0.44.0), referenced
# by apps/templates/headlamp-app.yaml as a second Application source so
# this stays reviewable in Git instead of living inline in the Application.
replicaCount: 3

serviceAccount:
  # Pod's own runtime identity — minimal, chart-default. Not used for UI
  # login (see manifests/headlamp/rbac/).
  create: true
  name: ""

clusterRoleBinding:
  # The chart's default binds its own ServiceAccount to cluster-admin;
  # disabled because RBAC for this lab is managed separately in
  # manifests/headlamp/rbac/ with two comparable identities.
  create: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: headlamp.localtest.me
      paths:
        - path: /
          type: Prefix
