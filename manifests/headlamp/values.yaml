# Values for the kubernetes-sigs/headlamp Helm chart, referenced
# by apps/templates/headlamp-app.yaml as a second Application source so
# this stays reviewable in Git instead of living inline in the Application.
replicaCount: 1

image:
  registry: ghcr.io
  repository: headlamp-k8s/headlamp
  # tag intentionally unset — the image then follows the chart version
  # (targetRevision in apps/templates/headlamp-app.yaml), using the
  # chart's own appVersion.

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  # Pod's own runtime identity — minimal, chart-default. Not used for UI
  # login (see manifests/headlamp/rbac/).
  create: true
  name: ""

clusterRoleBinding:
  # The chart's default binds its own ServiceAccount to cluster-admin;
  # disabled because RBAC for this lab is managed separately in
  # manifests/headlamp/rbac/ with two comparable identities.
  create: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: headlamp.localtest.me
      paths:
        - path: /
          type: Prefix
