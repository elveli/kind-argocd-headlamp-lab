# Login identities for the Headlamp UI — distinct from the Headlamp pod's
# own runtime ServiceAccount (created separately by the Helm chart with
# clusterRoleBinding.create: false, see ../values.yaml). Headlamp proxies
# API calls using whatever bearer token the browser supplies at login, so
# these two exist purely to be minted into tokens via `make headlamp-token`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  namespace: headlamp
