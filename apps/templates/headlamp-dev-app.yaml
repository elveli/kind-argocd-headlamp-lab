# Second Headlamp instance in its own namespace, for poking at chart/value
# changes without touching the primary `headlamp` release. The chart's
# targetRevision below is independent of headlamp-app.yaml and of
# versions.env — bump it here to try a new chart version on dev first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.46.0
      helm:
        valueFiles:
          - $values/manifests/headlamp-dev/values.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
