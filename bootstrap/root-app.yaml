# Rendered via envsubst (REPO_URL, TARGET_REVISION from versions.env) and
# applied by scripts/bootstrap.sh. This is the ONLY Application ever
# applied imperatively — it owns apps/, which owns everything else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${TARGET_REVISION}
    path: apps
    # apps/ is a small Helm chart (has Chart.yaml); Argo CD auto-detects
    # it as a Helm source. Passing repoURL/targetRevision back in as
    # values means every child Application also gets them from
    # versions.env, with the URL never hardcoded a second time anywhere
    # in the repo.
    helm:
      valuesObject:
        repoURL: ${REPO_URL}
        targetRevision: ${TARGET_REVISION}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
